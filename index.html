<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Culex Kitchen Tracker</title>
<style>*{box-sizing:border-box}body{margin:0 auto;font:14px Arial,sans-serif;padding:12px;max-width:1000px;color:#1a1a1a;background:#fff}
.top{display:flex;justify-content:space-between;align-items:center;background:#1F4E78;color:#fff;padding:10px 14px;border-radius:8px}.top h1{font-size:18px;margin:0}
h2{font-size:15px;margin:18px 0 6px;color:#1F4E78}.k{display:grid;grid-template-columns:repeat(auto-fit,minmax(110px,1fr));gap:8px;margin-top:10px}
.c{background:#f2f7fc;border:1px solid #d0d7de;border-radius:8px;padding:10px;text-align:center}.c b{display:block;font-size:24px;color:#1F4E78}.c span{font-size:12px;color:#666}
.sc{overflow-x:auto}table{border-collapse:collapse;width:100%}td,th{border:1px solid #d0d7de;padding:5px 8px;text-align:left;font-size:13px}th{background:#f2f7fc}
.f{display:flex;flex-wrap:wrap;gap:6px;align-items:flex-end}label{display:flex;flex-direction:column;font-size:12px;color:#666}input,select,button{font:inherit;padding:6px;border:1px solid #bbb;border-radius:6px}button{background:#1F4E78;color:#fff;cursor:pointer}
.m,.none{color:#666}.ok,.W{color:#2e7d32;font-weight:bold}.late,.R{color:#c62828;font-weight:bold}.O{color:#b26a00;font-weight:bold}.login{max-width:340px;margin:80px auto;text-align:center}
.al{background:#fff4d6;border:1px solid #f0c24b;border-radius:8px;padding:10px;margin-top:10px}.al table{margin-top:6px;background:#fff}</style></head><body><div id="app"></div>
<script>
const TY=["Annual Leave","Local Leave","Sick Leave","Emergency Leave","Unpaid Leave","Other"],RE=["New job","Personal / Family","Return to home country","Relocation","Salary / Benefits","Visa / Contract ended","Dismissed","Other"],REM=4;
const $=s=>document.querySelector(s),x=s=>String(s==null?"":s).replace(/[&<>"]/g,c=>"&#"+c.charCodeAt(0)+";"),td=new Date(Date.now()-new Date().getTimezoneOffset()*6e4).toISOString().slice(0,10);
const ad=(d,n)=>{const t=new Date(d+"T00:00:00Z");t.setUTCDate(t.getUTCDate()+n);return t.toISOString().slice(0,10)},df=(a,b)=>Math.round((Date.parse(b)-Date.parse(a))/864e5);
let D=null,busy=false,MB=0;
const call=async(action,o={})=>{const r=await fetch("/api",{method:"POST",body:JSON.stringify({code:sessionStorage.c,action,...o})}),j=await r.json();if(!r.ok){const e=new Error(j.error||"Error");e.status=r.status;throw e}return j};
const em=i=>D.E.find(e=>e[0]==i),nm=i=>em(i)?em(i)[1]:i,ps=i=>em(i)?em(i)[2]:"",k=(a,b)=>`<div class="c"><b>${b}</b><span>${a}</span></div>`;
const lst=(h,a)=>a.length?`<div class="sc"><table><tr>${h.map(v=>"<th>"+v+"</th>").join("")}</tr>${a.map(r=>"<tr>"+r.map(v=>"<td>"+x(v)+"</td>").join("")+"</tr>").join("")}</table></div>`:'<p class="m">None</p>';
const when=n=>n==0?"today":n==1?"tomorrow":"in "+n+" days",am=(d,n)=>{const t=new Date(d+"T00:00:00Z");t.setUTCMonth(t.getUTCMonth()+n);return t.toISOString().slice(0,10)};
function stat(b,L,R){const ids=new Set(D.E.filter(e=>e[3]==b).map(e=>e[0])),rs=new Set(R.filter(r=>r.d<=td).map(r=>r.e).filter(i=>ids.has(i))),
on=L.filter(l=>l.a=="Approved"&&l.s<=td&&td<=l.d&&ids.has(l.e)&&!rs.has(l.e));
return{n:ids.size,act:ids.size-rs.size,on,pend:L.filter(l=>l.a=="Pending"&&ids.has(l.e)&&!rs.has(l.e)).length,res:rs.size}}
const soon=()=>{const rs=new Set(D.R.filter(r=>r.d<=td).map(r=>r.e));return D.L.filter(l=>(l.a=="Approved"||l.a=="Pending")&&em(l.e)&&!rs.has(l.e)&&l.s>=td&&l.s<=am(td,REM)).sort((a,b)=>a.s.localeCompare(b.s))};
const alert3=m=>{const a=soon();return a.length?`<div class="al"><b>Reminder: leave starting within ${REM} months (${a.length})</b>${lst([m?"Employee":"Employee",...(m?["Branch"]:[]),"Leave starts","Returns","Status"].map(x),a.map(l=>[nm(l.e),...(m?[D.BR[l.b]]:[]),l.s+" ("+when(df(td,l.s))+")",ad(l.d,1),l.a=="Pending"?"Pending approval":"Approved"]))}</div>`:""};

const ph=id=>`<img src="/api?photo=${id}&code=${encodeURIComponent(sessionStorage.c)}&t=${Date.now()}" width="40" height="40" style="border-radius:50%;object-fit:cover;vertical-align:middle" onerror="this.style.visibility='hidden'">`;
const cend=()=>{const rs=new Set(D.R.filter(r=>r.d<=td).map(r=>r.e));return D.E.filter(e=>e[5]&&!rs.has(e[0])&&e[5]>=td&&e[5]<=am(td,2)).sort((a,b)=>a[5].localeCompare(b[5]))};
const alertC=()=>{const a=cend();return a.length?`<div class="al"><b>Contracts ending within 2 months (${a.length})</b>${lst(["Employee","Position","Contract ends"],a.map(e=>[e[1],e[2],e[5]]))}</div>`:""};
const sf=(b,n)=>run("setFull",{x:{b,n}}),sm=v=>run("setMail",{x:{b:MB,mail:v}}),ue=id=>run("updEmp",{x:{id,join:$("#j"+id).value,end:$("#c"+id).value}});
function up(id,f){if(!f.files[0])return;const r=new FileReader();r.onload=()=>{const i=new Image();i.onload=()=>{const c=document.createElement("canvas");c.width=c.height=120;const s=Math.min(i.width,i.height);c.getContext("2d").drawImage(i,(i.width-s)/2,(i.height-s)/2,s,s,0,0,120,120);run("photo",{x:{id,d:c.toDataURL("image/jpeg",.8)}})};i.src=r.result};r.readAsDataURL(f.files[0])}
const repBox=()=>`<h2>Report (past or future dates)</h2><div class="f"><label>From<input type="date" id="rf"></label><label>To<input type="date" id="rt"></label><button onclick="rep()">Show</button><button onclick="csv()">Download CSV</button></div><div id="rp"></div>`;
let RR=[];
function rep(){const f=$("#rf").value||td,t=$("#rt").value||f,rs=new Map(D.R.filter(r=>r.d<=td).map(r=>[r.e,r]));RR=[["Branch","Staff on payroll at "+t,"Leave entries in period","Leave days in period","Resignations in period","Contracts ending in period"]];
D.BR.forEach((b,i)=>{const E=D.E.filter(e=>e[3]==i);if(!E.length)return;const ids=new Set(E.map(e=>e[0])),act=E.filter(e=>(!e[4]||e[4]<=t)&&!(rs.get(e[0])&&rs.get(e[0]).d<t)).length,
L=D.L.filter(l=>ids.has(l.e)&&l.a=="Approved"&&l.s<=t&&l.d>=f),days=L.reduce((a,l)=>a+Math.max(0,df(l.s<f?f:l.s,l.d>t?t:l.d)+1),0),
R=D.R.filter(r=>ids.has(r.e)&&r.d>=f&&r.d<=t).length,C=E.filter(e=>e[5]&&e[5]>=f&&e[5]<=t).length;RR.push([b,act,L.length,days,R,C])});$("#rp").innerHTML=lst(RR[0],RR.slice(1))}
function csv(){rep();const f=$("#rf").value||td,t=$("#rt").value||f,a=[...RR,[],["Leave","Branch","Type","From","To","Status"],...D.L.filter(l=>l.s<=t&&l.d>=f).map(l=>[nm(l.e),D.BR[l.b],l.t,l.s,l.d,l.a]),[],["Resignation","Branch","Approved on","Last day","Reason"],...D.R.filter(r=>r.d>=f&&r.d<=t).map(r=>[nm(r.e),D.BR[r.b],r.ap||"",r.d,r.r])];
const s=a.map(r=>r.map(v=>'"'+String(v).replace(/"/g,'""')+'"').join(",")).join("\n"),l=document.createElement("a");l.href=URL.createObjectURL(new Blob(["\ufeff"+s],{type:"text/csv"}));l.download="report_"+f+"_"+t+".csv";l.click()}
const PC=["Basic","Cola","HRA","TRA","Leave salary","Gratuity","Visa","Staff food","Medical"],tc=a=>a?a.reduce((p,q)=>p+(+q||0),0):0,gg=a=>a?a.slice(0,4).reduce((p,q)=>p+(+q||0),0):0;let CR=[];
function payBox(){const st=D.E.filter(e=>e[3]==MB);return `<h2>Salary and cost details: ${x(D.BR[MB])}</h2><div class="sc"><table><tr><th>Name</th>${PC.map(c=>"<th>"+c+"</th>").join("")}<th>Gross</th><th>Total cost / month</th><th></th></tr>${st.map(e=>`<tr><td>${x(e[1])}</td>${PC.map((c,i)=>`<td><input type="number" style="width:70px" id="p${i}_${e[0]}" value="${e[6]&&e[6][i]!=null?e[6][i]:""}"></td>`).join("")}<td>${Math.round(gg(e[6]))}</td><td>${Math.round(tc(e[6]))}</td><td><button onclick="us(${e[0]})">Save</button></td></tr>`).join("")}</table></div><p class="m">Gross = Basic + Cola + HRA + TRA. Total cost = Gross + leave salary, gratuity, visa, staff food and medical (monthly).</p>`}
const us=id=>run("updEmp",{x:{id,sal:PC.map((c,i)=>+$("#p"+i+"_"+id).value||0)}});
function costBox(){const rs=new Set(D.R.filter(r=>r.d<=td).map(r=>r.e)),T=Array(9).fill(0),rows=[];D.BR.forEach((b,i)=>{const a=Array(9).fill(0);D.E.filter(e=>e[3]==i&&e[6]&&!rs.has(e[0])).forEach(e=>e[6].forEach((v,k)=>a[k]+=+v||0));a.forEach((v,k)=>T[k]+=v);rows.push([b,...a.map(Math.round),Math.round(gg(a)),Math.round(tc(a))])});
rows.push(["Total",...T.map(Math.round),Math.round(gg(T)),Math.round(tc(T))]);CR=[["Branch",...PC,"Gross","Total cost / month"],...rows];return `<h2>Monthly cost breakdown (active staff)</h2>${lst(CR[0],rows)}<button onclick="dl(CR,'cost')">Download CSV</button>`}
function dl(a,n){const s=a.map(r=>r.map(v=>'"'+String(v).replace(/"/g,'""')+'"').join(",")).join("\n"),l=document.createElement("a");l.href=URL.createObjectURL(new Blob(["\ufeff"+s],{type:"text/csv"}));l.download=n+"_"+td+".csv";l.click()}
const bar=t=>`<div class="top"><h1>${x(t)}</h1><button onclick="out()">Log out</button></div>`;
function master(){let T={a:0,o:0,p:0,r:0,u:0},rows="",ons=[],rr=[];const rs=new Set(D.R.filter(r=>r.d<=td).map(r=>r.e));
D.BR.forEach((b,i)=>{const L=D.L.filter(l=>l.b==i),R=D.R.filter(r=>r.b==i),s=stat(i,L,R),u=[...L,...R].map(v=>v.u||"").sort().pop()||"",
days=u?df(u,td):null,st=u?(days<=7?"ok":"late"):"none";
T.a+=s.act;T.o+=s.on.length;T.p+=s.pend;T.r+=s.res;if(u&&days<=7)T.u++;s.on.forEach(l=>ons.push(l));R.forEach(r=>{if(em(r.e))rr.push(r)});
const pay=D.E.filter(e=>e[3]==i&&e[6]&&!rs.has(e[0])).reduce((p,e)=>p+e[6].slice(0,4).reduce((u,q)=>u+(+q||0),0),0);rows+=`<tr><td>${x(b)}</td><td><input size="3" value="${(D.S.full||{})[i]||""}" onchange="sf(${i},this.value)"></td><td>${(D.S.full||{})[i]?D.S.full[i]-s.act:"-"}</td><td>${s.n}</td><td>${s.act}</td><td>${s.on.length}</td><td>${s.pend}</td><td>${s.res}</td><td class="${st}">${u?days+"d ago":"No data"}</td><td>${pay}</td></tr>`});
rr.sort((a,b)=>String(b.d).localeCompare(String(a.d)));
return bar("Culex Kitchen: Master Dashboard")+alert3(true)+alertC()+`<div class="k">${k("Active",T.a)}${k("On leave now",T.o)}${k("Leave in next "+REM+" months",soon().length)}${k("Pending",T.p)}${k("Resigned",T.r)}${k("Branches updated (7d)",T.u+"/"+D.BR.length)}</div><h2>By branch</h2><div class="sc"><table><tr><th>Branch</th><th>Full headcount</th><th>Vacancy</th><th>Staff</th><th>Active</th><th>On leave</th><th>Pending</th><th>Resigned</th><th>Last update</th><th>Gross payroll (active)</th></tr>${rows}</table></div>
<h2>On leave now</h2>${lst(["Employee","Branch","Position","Left on","Returns on"],ons.map(l=>[nm(l.e),D.BR[l.b],ps(l.e),l.s,ad(l.d,1)]))}
<h2>Resignations</h2>${lst(["Employee","Branch","Position","Approved on","Last working day","Reason"],rr.map(r=>[nm(r.e),D.BR[r.b],ps(r.e),r.ap||"-",r.d,r.r]))}`+repBox()+costBox()+payBox()+manage()}
function manage(){const st=D.E.filter(e=>e[3]==MB);return `<h2>Manage staff</h2><div class="f"><select onchange="MB=+this.value;draw()">${D.BR.map((b,i)=>`<option value="${i}"${i==MB?" selected":""}>${x(b)}</option>`).join("")}</select><label>Branch email (alerts)<input size="26" value="${x(D.S.mail[MB]||"")}" onchange="sm(this.value)"></label></div><div class="f" style="margin:8px 0"><label>Emp ID (optional)<input id="ei" size="9"></label><label>Full name<input id="en"></label><label>Position<select id="et">${D.TI.map(t=>"<option>"+x(t)+"</option>").join("")}</select></label><button onclick="ae()">Add employee</button></div><div class="sc"><table><tr><th>Photo</th><th>ID</th><th>Name</th><th>Position</th><th>First day at company</th><th>Contract ends</th><th></th></tr>${st.map(e=>`<tr><td>${ph(e[0])}<input type="file" accept="image/*" onchange="up(${e[0]},this)"></td><td>${e[0]}</td><td>${x(e[1])}</td><td>${x(e[2])}</td><td><input type="date" id="j${e[0]}" value="${e[4]||""}"></td><td><input type="date" id="c${e[0]}" value="${e[5]||""}"></td><td><button onclick="ue(${e[0]})">Save</button> <button onclick="de(${e[0]})">Remove</button></td></tr>`).join("")}</table></div>`}
function branch(){const b=D.b,s=stat(b,D.L,D.R),rs=new Map(D.R.filter(r=>r.d<=td).map(r=>[r.e,r])),on=new Map(s.on.map(l=>[l.e,l])),
opts=D.E.filter(e=>!rs.has(e[0])).map(e=>`<option value="${e[0]}">${x(e[1])} (${x(e[2])})</option>`).join(""),
roster=D.E.map(e=>{const r=rs.get(e[0]),o=on.get(e[0]),u=D.L.filter(l=>l.e==e[0]&&l.s>td&&l.a!="Cancelled")[0];
const st=r?"Resigned":o?"On leave":"Working",dt=r?"Approved "+(r.ap||"-")+", last day "+r.d:o?"Left "+o.s+", returns "+ad(o.d,1):u?"Next leave "+u.s+" to "+ad(u.d,1)+" (returns)":"";
return `<tr><td>${ph(e[0])} ${x(e[1])}<br><input type="file" accept="image/*" onchange="up(${e[0]},this)"></td><td>${x(e[2])}</td><td class="${st[0]}">${st}</td><td>${x(dt)}</td><td>${e[4]||"-"}</td><td>${e[5]||"-"}</td></tr>`}).join(""),
le=D.L.map(l=>`<tr><td>${x(nm(l.e))}</td><td>${x(l.t)}</td><td>${l.s}</td><td>${ad(l.d,1)}</td><td>${df(l.s,l.d)+1}</td><td>${l.a}</td><td><button onclick="rm('L','${l.id}')">Remove</button></td></tr>`).join(""),
re=D.R.map(r=>`<tr><td>${x(nm(r.e))}</td><td>${r.ap||"-"}</td><td>${r.d}</td><td>${x(r.r)}</td><td><button onclick="rm('R','${r.id}')">Remove</button></td></tr>`).join("");
return bar(D.BR[b])+alert3(false)+alertC()+`<div class="k">${k("Active"+((D.S.full||{})[b]?" of "+D.S.full[b]:""),s.act)}${k("On leave now",s.on.length)}${k("Leave in next "+REM+" months",soon().length)}${k("Pending",s.pend)}${k("Resigned",s.res)}</div>
<h2>Add leave</h2><div class="f"><label>Employee<select id="le">${opts}</select></label><label>Type<select id="lt">${TY.map(t=>"<option>"+t+"</option>").join("")}</select></label><label>First day<input type="date" id="ls"></label><label>Last day of leave<input type="date" id="ld"></label><label>Status<select id="la"><option>Approved</option><option>Pending</option></select></label><button onclick="al()">Add</button></div><p class="m">The return date is the day after the last day of leave.</p>
<h2>Record resignation</h2><div class="f"><label>Employee<select id="re">${opts}</select></label><label>Approved on<input type="date" id="ra"></label><label>Last working day<input type="date" id="rd"></label><label>Reason<select id="rr">${RE.map(t=>"<option>"+t+"</option>").join("")}</select></label><button onclick="ar()">Add</button></div>
<h2>Leave entries</h2><div class="sc"><table><tr><th>Employee</th><th>Type</th><th>Leaves on</th><th>Returns on</th><th>Days</th><th>Status</th><th></th></tr>${le}</table></div>
<h2>Resignations</h2><div class="sc"><table><tr><th>Employee</th><th>Approved on</th><th>Last working day</th><th>Reason</th><th></th></tr>${re}</table></div>
<h2>Staff</h2><div class="sc"><table><tr><th>Name</th><th>Position</th><th>Status</th><th>Details</th><th>First day</th><th>Contract ends</th></tr>${roster}</table></div>${repBox()}`}
const login=()=>`<div class="login"><h1 style="color:#1F4E78">Culex Kitchen Tracker</h1><p>Enter your code to continue</p><div class="f" style="justify-content:center"><input id="cd" placeholder="Access code" autocomplete="off"><button onclick="go()">Enter</button></div><p id="er" class="m"></p></div>`;
const draw=()=>{$("#app").innerHTML=D?(D.m?master():branch()):login()};
async function run(f,o){if(busy)return;busy=true;try{D=await call(f,o);draw()}catch(e){if(e.status==401){sessionStorage.removeItem("c");D=null;draw();$("#er").textContent="Code not recognised"}else alert(e.message||e)}busy=false}
async function go(){const c=$("#cd").value.trim();if(!c)return;sessionStorage.c=c;await run("data")}
function out(){sessionStorage.removeItem("c");D=null;draw()}
function al(){const e=+$("#le").value,s=$("#ls").value,d=$("#ld").value;if(!e||!s||!d||d<s)return alert("Choose an employee and valid dates");run("add",{kind:"L",x:{e,t:$("#lt").value,s,d,a:$("#la").value}})}
function ar(){const e=+$("#re").value,d=$("#rd").value,ap=$("#ra").value;if(!e||!d||!ap)return alert("Choose an employee, the approval date and the last working day");run("add",{kind:"R",x:{e,d,ap,r:$("#rr").value}})}
function rm(t,id){if(confirm("Remove this entry?"))run("remove",{kind:t,id})}
function ae(){const n=$("#en").value.trim();if(!n)return alert("Enter the full name");run("addEmp",{x:{id:$("#ei").value.trim(),name:n,title:$("#et").value,b:MB}})}
function de(id){if(confirm("Remove this employee from the branch list?"))run("delEmp",{id})}
draw();if(sessionStorage.c)run("data");
